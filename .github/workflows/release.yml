name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: |
          uv run --no-project python -c "import os,tomllib; p=tomllib.load(open('pyproject.toml','rb')); assert os.environ['GITHUB_REF_NAME']=='v'+p['project']['version']"
          uv build
      - name: Publish built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes
